fragment LeadDetailView on Lead {
  id
  inquiryAt
  branchId: locationId
  branch {
    id
    code
    name
    prefecture {
      code
      name
    }
  }
  studentName: name
  studentKana: name
  guardianName: name
  guardianKana: name
  schoolName: name
  gradeName: source
  phone
  email
  channel: source
  status
  note
  updatedAt
}

fragment LeadListItem on Lead {
  id
  inquiryAt
  branchId: locationId
  branch {
    id
    code
    name
    prefecture {
      code
      name
    }
  }
  studentName: name
  studentKana: name
  guardianName: name
  guardianKana: name
  schoolName: name
  gradeName: source
  phone
  email
  channel: source
  status
  updatedAt
}

fragment LeadOption on Lead {
  id
  branchId: locationId
  studentName: name
  guardianName: name
  schoolName: name
  status
}

query leadById($leadId: String!) {
  leadById(leadId: $leadId) {
    ...LeadDetailView
  }
}

query leadPage($pagination: Pagination!, $filter: LeadFilterInput) {
  leadPagination(pagination: $pagination, filter: $filter) {
    contents {
      ...LeadListItem
    }
    totalCount
    totalPages
    limit
    offset
  }
}

query allLeads {
  allLeads {
    ...LeadOption
  }
}

mutation createLead($input: LeadInput!) {
  createLead(input: $input) {
    id
  }
}

mutation updateLead($leadId: String!, $input: LeadInput!) {
  updateLead(leadId: $leadId, input: $input) {
    id
  }
}

mutation deleteLead($leadId: String!) {
  deleteLead(leadId: $leadId)
}
