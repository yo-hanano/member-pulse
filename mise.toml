[tools]
node = "24.20.0"
pnpm = "11.9.0"
python = "3.14.7"
java = "temurin-25.0.4+7.0.LTS"
ruby = "4.0.6"
gradle = "9.7.1"
terraform = "1.16.1"
vault = "1.21.4"
ansible-core = "2.21.3"
uv = "0.12.10"
task = "3.53.1"
just = "1.58.0"
"aqua:jesseduffield/lazydocker" = "0.25.2"
opencode = "latest"
"aqua:cli/cli" = "2.100.0"
"asdf:mise-plugins/mise-liquibase" = "5.0.3"
"asdf:mise-plugins/mise-quarkus" = "3.36.2"
"npm:@antfu/ni" = "latest"
"npm:@openai/codex" = "latest"
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@samuelfaj/distill" = "1.5.2"
"gem:kamal" = "2.12.0"

[env]
DISTILL_PROVIDER = "external"
DISTILL_API_KEY = "ollama"
DISTILL_HOST = "http://host.docker.internal:11434/v1"
DISTILL_MODEL = "gemma4:e4b"
DISTILL_DATASET_ENABLED = "false"

[settings.ruby]
compile = false

[settings.python]
precompiled_flavor = "install_only_stripped"
