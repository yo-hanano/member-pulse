[tools]
node = "24.14.0"
python = "3.13.12"
java = "temurin-25.0.2+10.0.LTS"
ruby = "3.4.8"
gradle = "9.5.1"
terraform = "1.14.6"
vault = "1.21.4"
ansible-core = "2.20.3"
uv = "0.11.14"
task = "3.51.1"
just = "1.51.0"
"aqua:jesseduffield/lazydocker" = "0.23.3"
opencode = "latest"
"aqua:cli/cli" = "2.92.0"
"asdf:mise-plugins/mise-liquibase" = "5.0.3"
"asdf:mise-plugins/mise-quarkus" = "3.36.0"
"npm:@antfu/ni" = "latest"
"npm:@openai/codex" = "latest"
"npm:@samuelfaj/distill" = "1.5.2"
"gem:kamal" = "2.11.0"

[env]
DISTILL_PROVIDER = "external"
DISTILL_API_KEY = "ollama"
DISTILL_HOST = "http://host.docker.internal:11434/v1"
DISTILL_MODEL = "gemma4:e4b"
DISTILL_DATASET_ENABLED = "false"

[settings.ruby]
compile = false

[settings.python]
precompiled_flavor = "install_only_stripped"
