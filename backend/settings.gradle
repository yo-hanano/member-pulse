pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id "${quarkusPluginId}" version "${quarkusPluginVersion}"
    }
}

rootProject.name = 'backend'

includeBuild("../migrate") {
    dependencySubstitution {
        substitute module("com.cxisystem:migrate") using project(":")
    }
}
