# 接続先は devcontainer の開発用 DB / Redis をそのまま使う。
# 使い捨て DB への切り替えは testcontainers 導入時に行う
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/member_pulse_dev
%test.quarkus.datasource.username=company_user
%test.quarkus.datasource.password=company_user
%test.quarkus.redis.hosts=redis://redis:6379

# 起動中の quarkusDev と衝突させないためランダムポートを使う
%test.quarkus.http.test-port=0

# JWT の鍵は環境変数に負けるため GraphQlTestProfile 側で上書きする
