quarkus:
  virtual-threads:
    enabled: true
  index-dependency:
    migrate:
      group-id: com.cxisystem
      artifact-id: migrate
  devservices:
    enabled: false
  http:
    port: 8080
    auth:
      permission:
        public-endpoints:
          paths: /public/*
          methods: POST
          policy: permit
        graphql-schema:
          paths: /graphql/schema.graphql
          methods: GET
          policy: permit
        quarkus-management:
          paths: /q/*
          policy: permit
        all:
          paths: /*
          policy: authenticated
  datasource:
    db-kind: postgresql
    username: ${QUARKUS_DATASOURCE_USERNAME:company_user}
    password: ${QUARKUS_DATASOURCE_PASSWORD:company_user}
    jdbc:
      url: ${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://postgres:5432/member_pulse_dev}
  log:
    level: INFO
  redis:
    hosts:
      - ${QUARKUS_REDIS_HOSTS:redis://redis:6379}
mp:
  jwt:
    verify:
      publickey:
        location: ${MP_JWT_VERIFY_PUBLICKEY_LOCATION:http://localhost:3000/.well-known/jwks.json}
      algorithm: RS256
      issuer: "cxi-system.com"
  graphql:
    showErrorMessage: com.cxisystem.exception.NotFoundException,com.cxisystem.exception.BadRequestException
    hideErrorMessage: java.lang.RuntimeException
    defaultErrorMessage: System error

smallrye:
  graphql:
    events:
      enabled: true
    errorExtensionFields: code,classification,queryPath
    schema:
      includeScalars: true
app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  employee-token:
    invite-ttl: ${APP_EMPLOYEE_INVITE_TTL:PT48H}
    reset-ttl: ${APP_EMPLOYEE_RESET_TTL:PT15M}
  rate-limit:
    invite:
      verify:
        limit: ${APP_RATE_LIMIT_INVITE_VERIFY_LIMIT:20}
        window: ${APP_RATE_LIMIT_INVITE_VERIFY_WINDOW:PT10M}
      complete:
        limit: ${APP_RATE_LIMIT_INVITE_COMPLETE_LIMIT:10}
        window: ${APP_RATE_LIMIT_INVITE_COMPLETE_WINDOW:PT10M}
    reset:
      request:
        limit: ${APP_RATE_LIMIT_RESET_REQUEST_LIMIT:10}
        window: ${APP_RATE_LIMIT_RESET_REQUEST_WINDOW:PT10M}
      complete:
        limit: ${APP_RATE_LIMIT_RESET_COMPLETE_LIMIT:10}
        window: ${APP_RATE_LIMIT_RESET_COMPLETE_WINDOW:PT10M}
